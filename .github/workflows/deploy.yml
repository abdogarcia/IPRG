name: Publicar web IPRG

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositori
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instal·lar dependències
        run: |
          pip install mkdocs-material pyyaml

      - name: Generar web global
        run: python3 web_iprg.py --generate-only
      
      - name: Construir web
        run: python3 -m mkdocs build -f _web_global/mkdocs.yml
        
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Pujar web
        uses: actions/upload-pages-artifact@v3
        with:
          path: _web_global/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4