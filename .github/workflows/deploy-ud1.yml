name: Publicar UD1

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositori
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instal·lar MkDocs i Material
        run: |
          pip install mkdocs-material

      - name: Generar web
        working-directory: ud1 Fonaments bàsics de la programació
        run: mkdocs build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Pujar artefacte
        uses: actions/upload-pages-artifact@v3
        with:
          path: ud1 Fonaments bàsics de la programació/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4