site_name: Introducció a la Programació (IPRG)
theme:
  name: material
  language: ca
  features:
  - content.code.copy
  palette:
    accent: deep purple
    primary: amber
extra_css:
- https://joamuran.net/curs24_25/css/material-just.css
plugins:
- search
markdown_extensions:
- attr_list
- md_in_html
- admonition
- pymdownx.details
- pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- toc:
    baselevel: 2
    toc_depth: 3
nav:
- Inici: index.md
- UD0 — Introducció al mòdul:
  - Benvinguts al curs d'Introducció a la Programació: ud0/index.md
  - Apunts del mòdul d'Introducció a la Programació': ud0/about.md
  - programacio aula: ud0/programacio_aula.md
- UD1 — Introducció a la programació:
  - Fonaments bàsics de la programació: ud1/index.md
  - Introducció a la Programació: ud1/1_IntroPRG.md
- UD3 — Introducció a Python:
  - Introducció a Python: ud3/3_Introduccio_a_Python.md
- UD5 — Programació estructurada. Control de flux en Python:
  - Programació estructurada. Control del flux en Python: ud5/index.md
  - 1. Programació estructurada i algoritmes: ud5/1.ProgramacioEstructurada.md
  - 2. Instruccions de bifurcació: ud5/2.Condicionals.md
  - 3. Bucles: ud5/3.Bucles.md
  - 4. Patrons habituals dins dels bucles: ud5/4.PatronsBucles.md
  - 5. Alteració del flux en els bucles: ud5/5.BreakContinue.md
  - 6. Algoritmes bàsics: ud5/6.AlgoritmesBasics.md
  - 7. Exercicis de repàs: ud5/7.Exercicis.md
- UD7 — Llistes i matrius:
  - 1. Introducció a les Matrius i Operacions Avançades: ud7/1.Introduccio.md
  - 2. Matrius (Arrays) i Matrius Multidimensionals: ud7/2.Matrius.md
  - 3. Manipulació de Cadenes de Text i Expressions Regulars: ud7/3.Cadenes_ER.md
  - '4. Operacions Agregades: Filtració, Reducció, Recol·lecció i Combinació': ud7/4.Agregades.md
  - 'Exercici 1: Creació de matrius unidimensionals i multidimensionals [6.a]': ud7/6.Exercicis.md
- UD8 — Fitxers:
  - 'UD3: E/S i Gestió de Dades 💾': ud8/index.md
  - 1. Introducció a l'Entrada/Sortida (E/S): ud8/1.Introduccio.md
  - 2. Operacions bàsiques d'Entrada i Sortida a la Consola: ud8/2.OperacionsBasiques.md
  - 3. Fluxos de Dades (Streams): ud8/3.FluxosDades.md
  - 4. Gestió de Fitxers: ud8/4.GestioFitxers.md
  - 6. Tractament de Documents i Intercanvi de Dades: ud8/5.Documents.md
  - 5. Tècniques avançades en la gestió de fitxers: ud8/5.TecniquesAvançades.md
  - 'Exercici 10: Creació, escriptura i lectura de JSON amb operacions agregades': ud8/6.ExercicisDocuments.md
  - 6. Eines i Llibreries per a E/S i Gestió de Dades: ud8/6.Llibreries.md
  - 1. Gestió de Fitxers - Crear, Llegir i Afegir Dades: ud8/7.Exercicis.md
  - Exercicis de Gestió de Fitxers i Fluxos de Dades: ud8/7.Exercicis_res.md
- UD9 — Altres:
  - 5. Control d'Excepcions (C3.4): ud9/5.Excepcions.md
  - 6. Assercions en Python (C3.5): ud9/6.Asercions.md
  - Depuració i Documentació del Codi (C3.6): ud9/7.DepuracioDocumentacio.md
  - 'Activitat 1: Crear un programa amb estructures de selecció': ud9/8.ActivitatsFinals.md
  - 'Introducció al Projecte: Gestió d''Entrades per a un Esdeveniment': ud9/9.Projecte_Part1.md
  - Solució Projecte - Part 1: ud9/10.Projecte_Solucio.md
watch:
- ../ud0 Introducció al mòdul/docs
- ../ud1 Introducció a la programació
- ../ud3 Introducció a Python
- ../ud5 Programació estructurada. Control de flux en Python/docs
- ../ud7 Llistes i matrius/u4/docs
- ../ud8 Fitxers/docs
- ../ud9 Altres/docs
